  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>OMX Live Control · pinklab<\u002Ftitle>\n\n<style>/* ============================================================\n   Pinklab Slide — Design System\n   Single entry point. Consumers link THIS file only.\n   Keep this as @import lines only — no rules here.\n   ============================================================ */\n\n/* ============================================================\n   Pinklab Slide — Webfonts\n   Sans  : Noto Sans KR (primary — Korean + Latin gothic). Chosen\n           because it ships by default in Google Slides / Docs, so\n           decks exported there will NOT fall back / break. Carries\n           ALL Korean text and most display, set bold.\n   Serif : Newsreader (English-only accent — pull quotes, hero\n           phrases in English). Never used for Korean.\n   Mono  : IBM Plex Mono (document meta / figures).\n   ------------------------------------------------------------\n   Declared as explicit @font-face so the system ships them to\n   consumers. Sources are CDN-hosted woff2. To self-host, drop\n   the binaries in /assets/fonts and swap the src url()s.\n   ============================================================ */\n\n/* ---- Noto Sans KR (weights 300–900 used) ---- */\n@font-face {\n  font-family: \"Noto Sans KR\";\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"655bb017-dfd9-400a-8656-532c06030222\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Noto Sans KR\";\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"73decaec-23ca-4223-9ad5-c512ff64cea0\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Noto Sans KR\";\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"006ac6c6-74d1-40ed-8562-17734c8ffa50\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Noto Sans KR\";\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"6888d8ad-7158-4791-988b-c4de5983aef6\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Noto Sans KR\";\n  font-weight: 800;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"dbc7197d-6785-45af-8f78-c162b55878ff\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Noto Sans KR\";\n  font-weight: 900;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"e3ed3418-c5c5-41bd-bf34-0ac331ca9eb7\") format(\"woff2\");\n}\n\n/* ---- Newsreader (English-only serif accent) ---- */\n@font-face {\n  font-family: \"Newsreader\";\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"5bfa655d-0394-406d-9584-5277aaf28440\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Newsreader\";\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"06d14675-56ed-4048-acc9-85943870fb71\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Newsreader\";\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"09161af8-4f0a-49c8-b3bd-b96d8fcca105\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"Newsreader\";\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n  src: url(\"54da6deb-f204-46e8-823b-a958b6b0ee1b\") format(\"woff2\");\n}\n\n/* ---- IBM Plex Mono (document meta / figures) ---- */\n@font-face {\n  font-family: \"IBM Plex Mono\";\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"b75c3cda-192f-4102-8f10-69856d1a1548\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"IBM Plex Mono\";\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"1815fe5b-0530-4862-bb44-15d9b5d8f088\") format(\"woff2\");\n}\n@font-face {\n  font-family: \"IBM Plex Mono\";\n  font-weight: 600;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"cbf8ad09-0341-4368-93d9-dc73d31038f6\") format(\"woff2\");\n}\n\n/* ============================================================\n   Pinklab Slide — Color tokens\n   Philosophy: an achromatic silver/white/black field does the\n   work. Pink is the primary POINT; ultramarine is the secondary\n   accent. The two fuse in the brand gradient (the logo mark).\n   Keep color to ~10% of any surface.\n   ============================================================ */\n\n:root {\n  /* ---- Brand pink (rose) — primary point color ---- */\n  --pink-50:  #FDEEF3;\n  --pink-100: #FBD9E4;\n  --pink-200: #F7B4CB;\n  --pink-300: #F286AC;\n  --pink-400: #EE6494;\n  --pink-500: #EC4B7E;  /* brand core */\n  --pink-600: #DA2E66;\n  --pink-700: #B61F52;\n  --pink-800: #8E1A42;\n  --pink-900: #5E1530;\n\n  /* ---- Ultramarine blue — secondary accent ---- */\n  --blue-50:  #ECEDFB;\n  --blue-100: #DADCF7;\n  --blue-200: #B7BAEF;\n  --blue-300: #8E92E6;\n  --blue-400: #6166DF;\n  --blue-500: #3D43DB;  /* ultramarine core */\n  --blue-600: #2E33C2;\n  --blue-700: #2528A0;\n  --blue-800: #1F2080;\n  --blue-900: #181955;\n\n  /* ---- Achromatic neutrals (cool silver — the lab field) ---- */\n  --white:    #FFFFFF;\n  --paper:    #F7F8F9;  /* cool off-white page tint */\n  --gray-50:  #F2F4F5;\n  --gray-100: #E8EAEC;\n  --gray-200: #D6D9DD;\n  --gray-300: #B9BDC4;\n  --gray-400: #8E939B;\n  --gray-500: #686D75;\n  --gray-600: #494D54;\n  --gray-700: #2F3238;\n  --gray-800: #1E2024;\n  --gray-900: #121316;  /* ink — near-black */\n  --black:    #0A0B0D;  /* true dark for full-bleed slides */\n\n  /* ---- Brand gradient (logo mark: pink → ultramarine) ---- */\n  --brand-gradient: linear-gradient(135deg, var(--pink-500) 0%, var(--blue-500) 100%);\n  --brand-gradient-soft: linear-gradient(135deg, var(--pink-400) 0%, var(--blue-400) 100%);\n\n  /* ---- Semantic: text ---- */\n  --text-strong:  var(--gray-900);  /* headlines */\n  --text-body:    var(--gray-700);  /* paragraphs */\n  --text-muted:   var(--gray-500);  /* captions, meta */\n  --text-faint:   var(--gray-400);  /* disabled, hints */\n  --text-accent:  var(--pink-600);  /* pink emphasis on light */\n  --text-blue:    var(--blue-600);  /* ultramarine emphasis on light */\n  --text-on-dark: var(--white);\n  --text-on-pink: var(--white);\n\n  /* ---- Semantic: surfaces ---- */\n  --surface-page:  var(--white);\n  --surface-paper: var(--paper);\n  --surface-card:  var(--white);\n  --surface-sunk:  var(--gray-50);\n  --surface-ink:   var(--gray-900);  /* dark slide background */\n  --surface-black: var(--black);\n  --surface-accent: var(--pink-500); /* solid pink block — use sparingly */\n  --surface-accent-soft: var(--pink-50);\n  --surface-blue:  var(--blue-500);\n  --surface-blue-soft: var(--blue-50);\n\n  /* ---- Semantic: borders + lines ---- */\n  --border-subtle:  var(--gray-200);\n  --border-default: var(--gray-300);\n  --border-strong:  var(--gray-900);\n  --border-accent:  var(--pink-500);\n  --rule-accent:    var(--pink-500);  /* the signature thin pink rule */\n\n  /* ---- Accent aliases ---- */\n  --accent:        var(--pink-500);\n  --accent-hover:  var(--pink-600);\n  --accent-press:  var(--pink-700);\n  --accent-soft:   var(--pink-50);\n  --secondary:        var(--blue-500);\n  --secondary-hover:  var(--blue-600);\n  --secondary-soft:   var(--blue-50);\n\n  /* ---- Focus ---- */\n  --focus-ring: var(--pink-500);\n}\n\n/* ============================================================\n   Pinklab Slide — Typography tokens\n   Korean is ALWAYS gothic (Noto Sans KR) — never serif. Large and\n   emphasised text is set BOLD (the proper way), not thin. A Latin\n   serif (Newsreader) is reserved for English-only accents — a\n   pull quote or a hero phrase in English. Korean never uses serif.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  /* Noto Sans KR is the primary face — it ships by default in Google\n     Slides/Docs, so exported decks won't break. Pretendard kept as a\n     graceful local fallback for anyone who has it installed. */\n  --font-sans: \"Noto Sans KR\", \"Pretendard Variable\", Pretendard, -apple-system,\n               BlinkMacSystemFont, \"Apple SD Gothic Neo\", \"Malgun Gothic\",\n               system-ui, sans-serif;\n  /* English-only serif accent. Do NOT set Korean text in this face. */\n  --font-serif-en: \"Newsreader\", Georgia, \"Times New Roman\", serif;\n  /* Monospace — for document meta, kickers, section numbers, figures/amounts.\n     The matte \"engineering doc\" voice. Korean falls back to Pretendard. */\n  --font-mono: \"IBM Plex Mono\", ui-monospace, SFMono-Regular, Menlo, Consolas,\n               \"Pretendard Variable\", monospace;\n  --font-display: var(--font-sans);   /* display is bold gothic */\n\n  /* ---- Weights ---- */\n  --fw-light:    300; /* @kind font */  /* body de-emphasis only — not for display */\n  --fw-regular:  400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n  --fw-extrabold:800; /* @kind font */  /* large display / hero */\n  --fw-black:    900; /* @kind font */\n\n  /* ---- Type scale (px — tuned for 1280×720 slides + general use) ---- */\n  --fs-eyebrow:  14px;   /* uppercase, letterspaced kicker */\n  --fs-caption:  16px;\n  --fs-body-sm:  18px;\n  --fs-body:     22px;\n  --fs-body-lg:  26px;\n  --fs-h3:       34px;\n  --fs-h2:       48px;\n  --fs-h1:       68px;\n  --fs-display:  96px;\n  --fs-mega:    140px;   /* hero numerals / single-word covers */\n\n  /* ---- Display emphasis weight (the proper, bold way) ---- */\n  --fw-display: var(--fw-extrabold);\n\n  /* ---- Line heights ---- */\n  --lh-tight:   1.04; /* @kind font */    /* display */\n  --lh-snug:    1.16; /* @kind font */    /* headings */\n  --lh-normal:  1.4;  /* @kind font */\n  --lh-relaxed: 1.6;  /* @kind font */    /* body copy */\n\n  /* ---- Letter spacing ---- */\n  --ls-eyebrow:  0.18em; /* @kind font */ /* the signature spaced kicker */\n  --ls-tight:   -0.025em; /* @kind font */ /* large bold display */\n  --ls-snug:    -0.01em; /* @kind font */\n  --ls-normal:   0;      /* @kind font */\n}\n\n/* ============================================================\n   Pinklab Slide — Spacing, radius, shadow, layout tokens\n   4px base grid. Generous slide gutters. Restrained radii and\n   soft, low shadows keep the system dignified — never bubbly.\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-16:  64px;\n  --space-20:  80px;\n  --space-24:  96px;\n  --space-30: 120px;\n\n  /* ---- Slide layout ---- */\n  --slide-w: 1280px;\n  --slide-h: 720px;\n  --slide-pad: 80px;        /* standard slide gutter */\n  --slide-pad-tight: 56px;\n\n  /* ---- Radius — restrained ---- */\n  --radius-0:  0;\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 12px;\n  --radius-xl: 20px;\n  --radius-pill: 999px;\n\n  /* ---- Borders ---- */\n  --border-w: 1px;\n  --border-w-thick: 2px;\n  --rule-w: 3px;            /* the signature pink rule weight */\n\n  /* ---- Shadows — soft + low ---- */\n  --shadow-sm: 0 1px 2px rgba(20, 18, 21, 0.06);\n  --shadow-md: 0 8px 24px rgba(20, 18, 21, 0.08);\n  --shadow-lg: 0 24px 64px rgba(20, 18, 21, 0.12);\n  --shadow-pink: 0 12px 32px rgba(236, 75, 126, 0.22);  /* use sparingly on pink CTAs */\n\n  /* ---- Motion ---- */\n  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);       /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);    /* @kind other */\n  --dur-fast: 140ms;  /* @kind other */\n  --dur-base: 240ms;  /* @kind other */\n  --dur-slow: 420ms;  /* @kind other */\n}\n\n/* ============================================================\n   Pinklab Slide — Base layer\n   Minimal element defaults wired to tokens. Consumers get a\n   sane starting point: Noto Sans KR everywhere, ink text on\n   white, the signature spaced eyebrow, and a pink rule helper.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-relaxed);\n  font-weight: var(--fw-regular);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  margin: 0;\n  color: var(--text-strong);\n  font-weight: var(--fw-bold);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--ls-snug);\n  text-wrap: balance;\n}\n\np { margin: 0; text-wrap: pretty; }\n\na { color: var(--text-accent); text-decoration: none; }\na:hover { color: var(--accent-hover); }\n\nstrong, b { font-weight: var(--fw-bold); color: var(--text-strong); }\n\n::selection { background: var(--pink-200); color: var(--gray-900); }\n\n:focus-visible {\n  outline: var(--border-w-thick) solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\n/* ---- Signature helpers ---- */\n\n/* The spaced uppercase kicker that opens most slides */\n.pl-eyebrow {\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-accent);\n}\n\n/* The signature thin pink rule */\n.pl-rule {\n  width: 56px;\n  height: var(--rule-w);\n  background: var(--rule-accent);\n  border: 0;\n  border-radius: var(--radius-pill);\n}\n\n/* English-only serif accent — opt in for English pull quotes / hero phrases */\n.pl-serif {\n  font-family: var(--font-serif-en);\n  font-weight: var(--fw-regular);\n  letter-spacing: var(--ls-normal);\n}\n\n<\u002Fstyle>\n<script src=\"bad688bd-7c68-4eb3-93b3-214b3f4d9718\"><\u002Fscript>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.160.0/build/three.module.js\",\n    \"three/addons/\": \"https://unpkg.com/three@0.160.0/examples/jsm/\",\n    \"three/examples/jsm/\": \"https://unpkg.com/three@0.160.0/examples/jsm/\",\n    \"urdf-loader\": \"https://cdn.jsdelivr.net/npm/urdf-loader@0.12.6/src/URDFLoader.js\"\n  }\n}\n<\u002Fscript>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; background: var(--surface-paper); color: var(--text-strong);\n    font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }\n  a { color: var(--text-accent); }\n  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 28px 60px; }\n\n  /* header */\n  .top { display: flex; align-items: center; gap: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--border-subtle); }\n  .top__logo { height: 22px; }\n  .top__title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }\n  .top__title span { color: var(--text-muted); font-weight: 500; }\n  .eyebrow { font: 600 11px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-accent); }\n  .status { margin-left: auto; display: inline-flex; align-items: center; gap: 9px; padding: 8px 15px;\n    border-radius: var(--radius-pill); border: 1px solid var(--border-default); background: var(--surface-card);\n    font: 600 13px var(--font-mono); color: var(--text-muted); }\n  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gray-400); }\n  .status[data-s=\"on\"] { border-color: var(--accent); color: var(--text-accent); }\n  .status[data-s=\"on\"] .dot { background: var(--accent); box-shadow: 0 0 0 0 rgba(236,75,126,.5); animation: pulse 1.8s infinite; }\n  .status[data-s=\"err\"] { border-color: var(--blue-500); color: var(--text-blue); }\n  .status[data-s=\"err\"] .dot { background: var(--blue-500); }\n  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(236,75,126,.45)} 70%{box-shadow:0 0 0 7px rgba(236,75,126,0)} 100%{box-shadow:0 0 0 0 rgba(236,75,126,0)} }\n\n  /* connection bar */\n  .conn { display: flex; gap: 10px; align-items: center; margin: 18px 0; flex-wrap: wrap; }\n  .field { display: flex; flex-direction: column; gap: 5px; }\n  .field label { font: 600 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }\n  input[type=text] { font: 500 14px var(--font-mono); padding: 11px 13px; border: 1px solid var(--border-default);\n    border-radius: var(--radius-md); background: var(--surface-card); color: var(--text-strong); min-width: 260px; }\n  input[type=text]:focus { outline: none; border-color: var(--accent); }\n  .btn { font: 600 14px var(--font-sans); padding: 11px 20px; border-radius: var(--radius-pill); border: 1px solid var(--border-default);\n    background: var(--surface-card); color: var(--text-strong); cursor: pointer; transition: transform 80ms var(--ease-out), background var(--dur-fast); }\n  .btn:active { transform: scale(0.97); }\n  .btn--pri { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: var(--shadow-pink); }\n  .btn--pri:hover { background: var(--accent-hover); }\n  .btn--ghost { background: transparent; }\n  .btn:disabled { opacity: 0.45; cursor: not-allowed; }\n\n  /* main layout */\n  .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 22px; align-items: stretch; }\n  @media (max-width: 880px){ .grid { grid-template-columns: 1fr; } }\n  .card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }\n  .card__bar { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--border-subtle); background: var(--surface-sunk); }\n  .card__t { font: 600 13px var(--font-mono); letter-spacing: 0.03em; color: var(--text-muted); }\n  .card__live { margin-left: auto; font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); }\n  .card__live[data-on] { color: var(--accent); }\n\n  .adv input { pointer-events: none; background: var(--surface-sunk) !important; color: var(--text-muted) !important; }\n  /* twin */\n  omx-arm { display: block; overflow: hidden; }\n  omx-arm canvas { display: block; width: 100% !important; height: 100% !important; }\n  .twin { position: relative; height: 460px; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, var(--white) 0%, var(--surface-sunk) 100%); }\n  .twin omx-arm { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; }\n  .twin__hint { position: absolute; left: 14px; bottom: 12px; font: 500 12px var(--font-mono); color: var(--text-faint); }\n  .readouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border-subtle); border-top: 1px solid var(--border-subtle); }\n  .ro { background: var(--surface-card); padding: 12px 16px; }\n  .ro__k { font: 600 11px var(--font-mono); letter-spacing: .06em; color: var(--text-faint); }\n  .ro__v { font: 700 17px var(--font-mono); color: var(--text-strong); margin-top: 3px; }\n\n  /* controls */\n  .ctl { padding: 18px; display: flex; flex-direction: column; gap: 14px; }\n  .jogs { display: flex; flex-direction: column; gap: 9px; }\n  .jog { display: grid; grid-template-columns: 96px 1fr 1fr; align-items: center; gap: 8px; }\n  .jog__l { font: 600 13px var(--font-sans); }\n  .jog__l span { font: 500 11px var(--font-mono); color: var(--text-faint); display: block; }\n  .keybtn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 12px;\n    border: 1px solid var(--border-default); border-bottom-width: 2px; border-radius: 8px; background: var(--surface-card);\n    font: 600 14px var(--font-sans); color: var(--text-body); cursor: pointer; transition: transform 80ms, background var(--dur-fast), border-color var(--dur-fast); }\n  .keybtn:hover { border-color: var(--border-strong); }\n  .keybtn:active, .keybtn[data-active] { transform: translateY(1px); background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }\n  .row { display: flex; gap: 8px; }\n  .grow { flex: 1; }\n  .posebtn { height: 38px; padding: 0 14px; border-radius: var(--radius-pill); border: 1px solid var(--border-default);\n    background: var(--surface-card); font: 600 13px var(--font-sans); color: var(--text-strong); cursor: pointer; }\n  .posebtn:active { transform: scale(0.97); }\n  .posebtn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }\n  .lbl { font: 600 11px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }\n  /* sliders + joint rows */\n  .jctl { display: flex; flex-direction: column; gap: 13px; }\n  .jrow { display: flex; flex-direction: column; gap: 6px; }\n  .jrow__top { display: flex; justify-content: space-between; align-items: baseline; }\n  .jrow__l { font: 600 13px var(--font-sans); color: var(--text-strong); }\n  .jrow__l b { font: 500 11px var(--font-mono); color: var(--text-faint); margin-left: 6px; }\n  .jrow__v { font: 700 14px var(--font-mono); color: var(--text-accent); font-variant-numeric: tabular-nums; }\n  .jrow__ctl { display: flex; align-items: center; gap: 9px; }\n  .keybtn.sq { width: 38px; padding: 0; flex: none; font-size: 18px; }\n  .slider { -webkit-appearance: none; appearance: none; flex: 1; height: 6px; border-radius: 999px;\n    background: var(--surface-sunk); border: 1px solid var(--border-subtle); outline: none; }\n  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 19px; height: 19px; border-radius: 50%;\n    background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(20,18,21,.28); cursor: grab; }\n  .slider::-moz-range-thumb { width: 19px; height: 19px; border-radius: 50%; background: var(--accent);\n    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(20,18,21,.28); cursor: grab; }\n  .slider:active::-webkit-slider-thumb { cursor: grabbing; }\n  .slider:focus { border-color: var(--accent); }\n  /* page tabs */\n  .pagenav { display: flex; gap: 4px; margin: 6px 0 18px; border-bottom: 1px solid var(--border-subtle); }\n  .pagetab { appearance: none; border: none; background: none; padding: 11px 18px; font: 600 14px var(--font-sans);\n    color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; }\n  .pagetab b { font: 700 12px var(--font-mono); width: 20px; height: 20px; border-radius: 5px; background: var(--surface-sunk);\n    border: 1px solid var(--border-subtle); display: inline-flex; align-items: center; justify-content: center; color: var(--text-faint); }\n  .pagetab:hover { color: var(--text-strong); }\n  .pagetab.on { color: var(--text-accent); border-bottom-color: var(--accent); }\n  .pagetab.on b { background: var(--accent); color: #fff; border-color: var(--accent); }\n  .page[hidden] { display: none; }\n  /* arm badge */\n  .armbadge { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: var(--radius-pill);\n    font: 600 12.5px var(--font-sans); border: 1px solid var(--border-subtle); background: var(--surface-card); color: var(--text-strong); }\n  .armbadge__dot { width: 8px; height: 8px; border-radius: 50%; background: #2A6FDB; }\n  .armbadge[data-arm=\"leader\"] { background: #FBEAF1; border-color: #F3C6DA; color: #B01E63; }\n  .armbadge[data-arm=\"leader\"] .armbadge__dot { background: #EC4B7E; }\n  .armbadge b { font-weight: 700; }\n  .top .status { margin-left: 12px; }\n  /* leader experience */\n  .ldhead { margin: 2px 0 16px; }\n  .ldhead h2 { font: 700 22px var(--font-sans); margin: 0 0 6px; color: var(--text-strong); }\n  .ldhead p { margin: 0; color: var(--text-muted); font-size: 14px; line-hei text-accent); }\n  .log { margin-top: 14px; background: var(--gray-900); border-radius: var(--radius-md); padding: 12px 14px; height: 140px; overflow-y: auto;\n    font: 500 12.5px/1.6 var(--font-mono); color: var(--gray-300); }\n  .log .t { color: var(--gray-500); } .log .ok { color: var(--pink-400); } .log .er { color: #ff8a8a; } .log .tx { color: #9fd0ff; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"wrap\">\n\n  <div class=\"top\">\n    <img class=\"top__logo\" src=\"897993d4-6abe-4373-be6a-d1373bd2bb75\" alt=\"PINKLAB\">\n    <div>\n      <div class=\"eyebrow\">ROS 2 · LIVE CONTROL<\u002Fdiv>\n      <div class=\"top__title\">OMX Live Control <span>· 실시간 제어 패널<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"armbadge\" id=\"armBadge\" data-arm=\"follower\"><span class=\"armbadge__dot\"><\u002Fspan><b>팔로워암<\u002Fb> · OMX-F<\u002Fdiv>\n    <div class=\"status\" id=\"status\" data-s=\"off\"><span class=\"dot\"><\u002Fspan><span id=\"statusTxt\">연결 안 됨<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"conn\">\n    <div class=\"field\">\n      <label for=\"wsurl\">rosbridge WebSocket 주소<\u002Flabel>\n      <input type=\"text\" id=\"wsurl\" value=\"ws://localhost:9090\" spellcheck=\"false\">\n    <\u002Fdiv>\n    <button class=\"btn btn--pri\" id=\"connectBtn\">연결<\u002Fbutton>\n    <button class=\"btn btn--ghost\" id=\"disconnectBtn\" disabled=\"\">해제<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"pagenav\">\n    <button class=\"pagetab on\" data-page-btn=\"control\"><b>1<\u002Fb> 관절 제어<\u002Fbutton>\n    <button class=\"pagetab\" data-page-btn=\"compare\"><b>2<\u002Fb> MoveJ · MoveL 경로 비교<\u002Fbutton>\n    <button class=\"pagetab\" data-page-btn=\"leader\"><b>3<\u002Fb> 리더암 · 임피던스·중력보상<\u002Fbutton>\n    <button class=\"pagetab\" data-page-btn=\"setup\"><b>4<\u002Fb> 설정 가이드<\u002Fbutton>\n  <\u002Fdiv>\n\n  <section class=\"page\" data-page=\"control\">\n  <div class=\"grid\">\n    <!-- digital twin -->\n    <div class=\"card\">\n      <div class=\"card__bar\">\n        <div class=\"card__t\">OMX-F · 디지털 트윈<\u002Fdiv>\n        <div class=\"card__live\" id=\"twinLive\">offline preview<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"twin\"><omx-arm id=\"twin\"><\u002Fomx-arm><div class=\"twin__hint\">관절을 잡아 드래그 = 직접 조작 · 빈 곳 드래그 = 시점 회전<\u002Fdiv><\u002Fdiv>\n      <div class=\"readouts\" id=\"readouts\">\n        <div class=\"ro\"><div class=\"ro__k\">J1 · 베이스<\u002Fdiv><div class=\"ro__v\" data-ro=\"joint1\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"ro\"><div class=\"ro__k\">J2 · 숄더<\u002Fdiv><div class=\"ro__v\" data-ro=\"joint2\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"ro\"><div class=\"ro__k\">J3 · 엘보<\u002Fdiv><div class=\"ro__v\" data-ro=\"joint3\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"ro\"><div class=\"ro__k\">J4 · 손목 피치<\u002Fdiv><div class=\"ro__v\" data-ro=\"joint4\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"ro\"><div class=\"ro__k\">J5 · 손목 롤<\u002Fdiv><div class=\"ro__v\" data-ro=\"joint5\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"ro\"><div class=\"ro__k\">Gripper<\u002Fdiv><div class=\"ro__v\" data-ro=\"gripper\">—<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- controls -->\n    <div class=\"card\">\n      <div class=\"card__bar\"><div class=\"card__t\">관절 조작 · JointTrajectory<\u002Fdiv><\u002Fdiv>\n      <div class=\"ctl\" id=\"controls\">\n        <div class=\"lbl\">관절 제어 — 슬라이더 · ± 버튼 · 3D 드래그<\u002Fdiv>\n        <div class=\"jctl\">\n          <div class=\"jrow\">\n            <div class=\"jrow__top\"><span class=\"jrow__l\">Joint 1 <b>베이스<\u002Fb><\u002Fspan><span class=\"jrow__v\" data-val=\"joint1\">11°<\u002Fspan><\u002Fdiv>\n            <div class=\"jrow__ctl\"><button class=\"keybtn sq\" data-jog=\"joint1\" data-dir=\"-1\">−<\u002Fbutton><input type=\"range\" class=\"slider\" data-slider=\"joint1\" min=\"-180\" max=\"180\" step=\"1\" value=\"11\"><button class=\"keybtn sq\" data-jog=\"joint1\" data-dir=\"1\">+<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"jrow\">\n            <div class=\"jrow__top\"><span class=\"jrow__l\">Joint 2 <b>숄더<\u002Fb><\u002Fspan><span class=\"jrow__v\" data-val=\"joint2\">-23°<\u002Fspan><\u002Fdiv>\n            <div class=\"jrow__ctl\"><button class=\"keybtn sq\" data-jog=\"joint2\" data-dir=\"-1\">−<\u002Fbutton><input type=\"range\" class=\"slider\" data-slider=\"joint2\" min=\"-120\" max=\"90\" step=\"1\" value=\"-23\"><button class=\"keybtn sq\" data-jog=\"joint2\" data-dir=\"1\">+<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"jrow\">\n            <div class=\"jrow__top\"><span class=\"jrow__l\">Joint 3 <b>엘보<\u002Fb><\u002Fspan><span class=\"jrow__v\" data-val=\"joint3\">34°<\u002Fspan><\u002Fdiv>\n            <div class=\"jrow__ctl\"><button class=\"keybtn sq\" data-jog=\"joint3\" data-dir=\"-1\">−<\u002Fbutton><input type=\"range\" class=\"slider\" data-slider=\"joint3\" min=\"-120\" max=\"90\" step=\"1\" value=\"34\"><button class=\"keybtn sq\" data-jog=\"joint3\" data-dir=\"1\">+<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"jrow\">\n            <div class=\"jrow__top\"><span class=\"jrow__l\">Joint 4 <b>손목 피치<\u002Fb><\u002Fspan><span class=\"jrow__v\" data-val=\"joint4\">17°<\u002Fspan><\u002Fdiv>\n            <div class=\"jrow__ctl\"><button class=\"keybtn sq\" data-jog=\"joint4\" data-dir=\"-1\">−<\u002Fbutton><input type=\"range\" class=\"slider\" data-slider=\"joint4\" min=\"-100\" max=\"100\" step=\"1\" value=\"17\"><button class=\"keybtn sq\" data-jog=\"joint4\" data-dir=\"1\">+<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"jrow\">\n            <div class=\"jrow__top\"><span class=\"jrow__l\">Joint 5 <b>손목 롤<\u002Fb><\u002Fspan><span class=\"jrow__v\" data-val=\"joint5\">0°<\u002Fspan><\u002Fdiv>\n            <div class=\"jrow__ctl\"><button class=\"keybtn sq\" data-jog=\"joint5\" data-dir=\"-1\">−<\u002Fbutton><input type=\"range\" class=\"slider\" data-slider=\"joint5\" min=\"-180\" max=\"180\" step=\"1\" value=\"0\"><button class=\"keybtn sq\" data-jog=\"joint5\" data-dir=\"1\">+<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"lbl\">그리퍼 — 열림 정도<\u002Fdiv>\n        <div class=\"jrow\">\n          <div class=\"jrow__top\"><span class=\"jrow__l\">Gripper<\u002Fspan><span class=\"jrow__v\" data-val=\"gripper\">50%<\u002Fspan><\u002Fdiv>\n          <div class=\"jrow__ctl\"><button class=\"keybtn sq\" data-grip=\"close\" title=\"닫기\">−<\u002Fbutton><input type=\"range\" class=\"slider\" data-slider=\"gripper\" min=\"0\" max=\"100\" step=\"1\" value=\"50\"><button class=\"keybtn sq\" data-grip=\"open\" title=\"열기\">+<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"lbl\">자세 프리셋<\u002Fdiv>\n        <div class=\"row\"><button class=\"posebtn grow\" data-pose=\"init\">Init Pose<\u002Fbutton><button class=\"posebtn grow accent\" data-pose=\"home\">Home Pose<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-page=\"compare\" hidden=\"\">\n  <div class=\"cmphead\">\n    <h2>OMX 모션 플래닝 — MoveJ · MoveL 경로 비교<\u002Fh2>\n    <p style=\"white-space:nowrap;\">목표 지점까지의 궤적을 생성하는 계층 · 보간 공간에 따라 구분됨 — 3D 시뮬레이터로 같은 시작·목표가 곡선·직선으로 갈리는 걸 확인.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"card__bar\">\n      <div class=\"card__t\">경로 비교 · 직접 재생<\u002Fdiv>\n      <div class=\"card__live\" id=\"cmpLive\">체험<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cmpbar\">\n      <div class=\"cmpseg\" id=\"cmpSeg\">\n        <button data-m=\"movej\" class=\"on\">MoveJ<\u002Fbutton>\n        <button data-m=\"movel\">MoveL<\u002Fbutton>\n        <button data-m=\"both\">둘 다<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"cmpsp\">\n        <span class=\"cmpspd\">속도 <input type=\"range\" id=\"cmpSpeed\" min=\"0.3\" max=\"2\" step=\"0.1\" value=\"1\"><\u002Fspan>\n        <button class=\"cmpplay\" id=\"cmpPlay\">▶ 재생<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cmpstage\">\n      <span class=\"cmpbadge j\" id=\"cmpBj\">MoveJ — 끝단이 곡선<\u002Fspan>\n      <span class=\"cmpbadge l\" id=\"cmpBl\" style=\"display:none\">MoveL — 끝단이 직선<\u002Fspan>\n      <canvas id=\"cmpCv\" width=\"960\" height=\"440\"><\u002Fcanvas>\n    <\u002Fdiv>\n    <div class=\"cmpnote\">같은 <b>A→B<\u002Fb>인데 <b style=\"color:#EC4B7E\">MoveJ<\u002Fb>는 끝단이 곡선으로 휘고, <b style=\"color:#2A6FDB\">MoveL<\u002Fb>은 직선을 따라간다. 회색 점선 = 두 점을 잇는 직선. 위 버튼으로 모드를 바꿔 재생해 보세요.<\u002Fdiv>\n    <div class=\"cmprun\">\n      <div class=\"cmprun__t\">실제 OMX로 실행 <span>rosbridge 연결 시 실제 로봇 · 미연결 시 명령만<\u002Fspan><\u002Fdiv>\n      <div class=\"cmprun__row\">\n        <button id=\"cmpInit\">① 초기 자세<\u002Fbutton>\n        <button id=\"cmpRunJ\">② MoveJ 실행 · 곡선<\u002Fbutton>\n        <button id=\"cmpRunL\">③ MoveL 실행 · 직선<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"cmprun__hint\" id=\"cmpRunHint\">②·③ 버튼은 먼저 초기 자세로 이동한 뒤 같은 목표로 움직입니다. 아래 3D URDF 로봇이 그대로 움직입니다.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cmp3d\"><omx-arm id=\"cmpTwin\"><\u002Fomx-arm><div class=\"cmp3d__hint\"><span style=\"color:#8E939B\">●<\u002Fspan> 시작 &nbsp; <span style=\"color:#EC4B7E\">●<\u002Fspan> 목표(MoveJ·MoveL 공통) &nbsp;·&nbsp; 실행 버튼을 누르면 로봇이 움직입니다<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" data-page=\"leader\" hidden=\"\" data-screen-label=\"리더암 체험\">\n  <div class=\"ldhead\">\n    <span class=\"pill\">LEADER ARM · OMX-L<\u002Fspan>\n    <h2>리더암 — 임피던스 · 중력보상<\u002Fh2>\n    <p>3D 팔을 <b>드래그해서 밀어보기<\u002Fb> · 모드를 바꾸면 밀었을 때 반응이 달라진다<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; flex-direction:column; gap:18px; margin-bottom:18px;\">\n    <div class=\"card\">\n      <div class=\"card__bar\">\n        <div class=\"card__t\">1 · 시뮬레이션 — 밀어보기 <span style=\"font:500 11.5px var(--font-mono); color:var(--text-faint); margin-left:8px;\">어깨(joint2)·팔꿈치(joint3) 두 축 움직임 · 개념 이해용<\u002Fspan><\u002Fdiv>\n        <div class=\"card__live\" id=\"ldLive\">체험<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ld3d\">\n        <div class=\"ldgauge\"><div class=\"ldgauge__track\"><div class=\"ldgauge__center\"><\u002Fdiv><div class=\"ldgauge__fill\" id=\"ldGaugeFill\"><\u002Fdiv><\u002Fdiv><div class=\"ldgauge__lab\" id=\"ldGaugeLab\">제자리<\u002Fdiv><\u002Fdiv>\n        <omx-arm id=\"leadTwin\" model=\"omx_l\"><\u002Fomx-arm>\n        <div class=\"ld3d__hint\">로봇 팔을 잡고 드래그 = 밀기 · 빈 곳 드래그 = 화면 회전 · <b style=\"color:#EC4B7E;\">핑크색 부분<\u002Fb> = 움직이는 두 축 어깨(joint2)·팔꿈치(joint3)<\u002Fdiv>\n        <button class=\"ldpush\" id=\"ldPush\">밀기<\u002Fbutton>\n        <div class=\"ld3d__ang\" id=\"ldAng\">j2 –° · j3 –°<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:14px 18px 16px;\">\n        <div class=\"ldmodes\" id=\"ldModes\">\n          <button data-mode=\"pos\"><b>위치제어<\u002Fb><span>밀어도 꿈쩍 안 함<\u002Fspan><\u002Fbutton>\n          <button data-mode=\"imp\" class=\"on\"><b>임피던스<\u002Fb><span>스프링처럼 밀렸다 복귀<\u002Fspan><\u002Fbutton>\n          <button data-mode=\"grav\"><b>중력보상<\u002Fb><span>민 자리에 고정<\u002Fspan><\u002Fbutton>\n          <button data-mode=\"goff\"><b>보상 OFF<\u002Fb><span>제 무게로 스르르 처짐<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"ldsliders\">\n          <div class=\"ldsl\"><div class=\"ldsl__top\"><span>강성 K (딱딱함)<\u002Fspan><b id=\"ldKv\">60<\u002Fb><\u002Fdiv><input type=\"range\" id=\"ldK\" min=\"0\" max=\"600\" step=\"1\" value=\"60\"><\u002Fdiv>\n          <div class=\"ldsl\"><div class=\"ldsl__top\"><span>감쇠 D (출렁임 억제)<\u002Fspan><b id=\"ldDv\">10<\u002Fb><\u002Fdiv><input type=\"range\" id=\"ldD\" min=\"0\" max=\"50\" step=\"1\" value=\"10\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ldverdict\" id=\"ldVerdict\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"card__bar\">\n        <div class=\"card__t\">2 · 실물 OMX-L — rosbridge<\u002Fdiv>\n        <div class=\"card__live\" id=\"ldRealLive\">미연결<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;\">\n        <div class=\"ldverdict\" id=\"ldRealHint\" style=\"margin:0 0 10px;\"><span class=\"chip\">준비<\u002Fspan> 상단에서 <code>ws://…:9090<\u002Fcode> 연결 후 사용하세요.<\u002Fdiv>\n        <div class=\"ldfeat\" style=\"flex-direction:column; align-items:stretch; gap:10px;\">\n          <div class=\"ldfeat__t\"><b>사용 순서: 끈 상태에서 팔을 원하는 자세로 → 켜기(⚠ 팔 잡고) → 모드 선택<\u002Fb><span>모드를 누르는 순간의 자세가 스프링 제자리(기준)로 자동 저장됨 · <b>모드를 바꿀 땐 끄기 → 다시 켜기 후 선택<\u002Fb> · 중력보상 = K 0 · 관절별 튜닝값 내장<\u002Fspan><\u002Fdiv>\n          <div class=\"ldbtns\" style=\"flex-wrap:wrap; align-items:stretch;\">\n            <button class=\"ldbtn accent\" id=\"ldMirrorBtn\">미러링 시작<\u002Fbutton>\n            <span style=\"width:1px; background:var(--border-subtle); margin:2px 4px;\"><\u002Fspan>\n            <button class=\"ldbtn accent\" id=\"ldImpOn\">켜기<\u002Fbutton>\n            <button class=\"ldbtn\" id=\"ldImpOff\">끄기<\u002Fbutton>\n            <span style=\"width:1px; background:var(--border-subtle); margin:2px 4px;\"><\u002Fspan>\n            <button class=\"ldbtn\" id=\"ldModeGrav\">중력보상<small style=\"display:block; font-size:10px; opacity:.7;\">밀면 민 자리에 고정<\u002Fsmall><\u002Fbutton>\n            <button class=\"ldbtn\" id=\"ldModeFirm\">임피던스 제어<small style=\"display:block; font-size:10px; opacity:.7;\">지금 자세로 되밀고 복귀<\u002Fsmall><\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:8px; border:1px solid var(--pink-200, #F3C6DA); background: var(--pink-50, #FFF7FA); border-radius: var(--radius-md); padding:11px 13px; font:500 12px/1.6 var(--font-sans); color: var(--text-muted);\">\n          <b style=\"color:#B01E63;\">⚠ 주의<\u002Fb> · <b>그리퍼(6번)는 중력보상·임피던스 대상이 아님<\u002Fb> (위치 모드 유지 — 손으로 억지로 벌리지 말 것) · 모터에 <b>빨간불<\u002Fb> = 과부하 보호 (센 스프링에서 세게 민 채 버티면 발생) — 전원 재투입 후 몇 분 식히기 · 켜기·모드 전환 순간엔 항상 <b>팔을 손으로 받치기<\u002Fb> · 비상 정지 = launch 터미널 Ctrl+C\n        <\u002Fdiv>\n        <details style=\"display:none;\">\n          <summary><\u002Fsummary>\n          <div class=\"ldadv\">\n            <div class=\"field\"><label>리더 joint_states 토픽<\u002Flabel><input type=\"text\" id=\"ldStatesTopic\" value=\"/leader/joint_states\"><\u002Fdiv>\n            <div class=\"field\"><label>controller_manager 네임스페이스<\u002Flabel><input type=\"text\" id=\"ldCmNs\" value=\"/leader/controller_manager\"><\u002Fdiv>\n            <div class=\"field\"><label>중력보상 컨트롤러 이름<\u002Flabel><input type=\"text\" id=\"ldCtlName\" value=\"gravity_compensation_controller\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n        <div class=\"ldnote\" style=\"margin-top:12px;\">터미널 실행 방법은 상단 <b>4 · 설정 가이드<\u002Fb> 탭 참고 — 리더암은 터미널 ③ 하나만 추가하면 됩니다.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsection>\n\n  <details style=\"display:none;\">\n    <summary><\u002Fsummary>\n    <div class=\"adv\">\n      <div class=\"field\"><label>Arm 컨트롤러 토픽<\u002Flabel><input type=\"text\" id=\"armTopic\" value=\"/arm_controller/joint_trajectory\"><\u002Fdiv>\n      <div class=\"field\"><label>Arm 조인트 이름 (쉼표)<\u002Flabel><input type=\"text\" id=\"armJoints\" value=\"joint1,joint2,joint3,joint4,joint5\"><\u002Fdiv>\n      <div class=\"field\"><label>Gripper 액션 (GripperCommand)<\u002Flabel><input type=\"text\" id=\"gripAction\" value=\"/gripper_controller/gripper_cmd\"><\u002Fdiv>\n      <div class=\"field\"><label>Gripper 조인트 이름<\u002Flabel><input type=\"text\" id=\"gripJoint\" value=\"gripper_joint_1\"><\u002Fdiv>\n      <div class=\"field\"><label>Gripper 열림 / 닫힘 (rad)<\u002Flabel><input type=\"text\" id=\"gripVals\" value=\"0.9, -0.5\"><\u002Fdiv>\n      <div class=\"field\"><label>Gripper max_effort (N)<\u002Flabel><input type=\"text\" id=\"gripEffort\" value=\"1.0\"><\u002Fdiv>\n      <div class=\"field\"><label>이동 시간 (초)<\u002Flabel><input type=\"text\" id=\"moveTime\" value=\"2.0\"><\u002Fdiv>\n      <div class=\"field\"><label>안전 한계 J1 (°, min,max)<\u002Flabel><input type=\"text\" id=\"safe_joint1\" value=\"-30,30\"><\u002Fdiv>\n      <div class=\"field\"><label>안전 한계 J2<\u002Flabel><input type=\"text\" id=\"safe_joint2\" value=\"-120,-75\"><\u002Fdiv>\n      <div class=\"field\"><label>안전 한계 J3<\u002Flabel><input type=\"text\" id=\"safe_joint3\" value=\"25,85\"><\u002Fdiv>\n      <div class=\"field\"><label>안전 한계 J4<\u002Flabel><input type=\"text\" id=\"safe_joint4\" value=\"25,90\"><\u002Fdiv>\n      <div class=\"field\"><label>안전 한계 J5<\u002Flabel><input type=\"text\" id=\"safe_joint5\" value=\"-32,50\"><\u002Fdiv>\n      <div class=\"field\"><label>안전 한계 그리퍼 (행정 %)<\u002Flabel><input type=\"text\" id=\"safe_gripper\" value=\"30,60\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdetails>\n\n  <section class=\"page\" data-page=\"setup\" hidden=\"\" data-screen-label=\"설정 가이드\">\n  <div class=\"cmphead\">\n    <h2>설정 가이드 — 터미널 4개 사용<\u002Fh2>\n    <p>이 앱은 로봇을 직접 빌드하지 않습니다. 아래 터미널들이 로봇을 움직이고, 웹앱은 <span class=\"mono\">rosbridge<\u002Fspan>로 명령을 보냅니다.<br><b>전부 OMX가 연결된 PC의 Docker 컨테이너 안<\u002Fb>에서 실행하세요.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"card\" style=\"margin-bottom:16px;\">\n    <div class=\"card__bar\"><div class=\"card__t\">공통 준비 — 모든 터미널에서 제일 먼저<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:14px 18px 16px;\">\n      <div class=\"cmd\"><span class=\"c\"># ① 컨테이너 진입 (호스트 PC에서 · 터미널마다)<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> cd ~/ros2_ws/src/open_manipulator/docker\n<span class=\"pr\">$<\u002Fspan> ./container.sh enter\n<span class=\"c\"># ② 컨테이너 안에서 — 모든 터미널 공통<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> source ~/ros2_ws/install/setup.bash<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; margin-bottom:16px;\">\n    <div class=\"card\">\n      <div class=\"card__bar\"><div class=\"card__t\">터미널 ① — Zenoh 데몬 (항상 첫 번째!)<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:14px 18px 16px;\">\n        <div class=\"cmd\"><span class=\"pr\">$<\u002Fspan> ros2 run rmw_zenoh_cpp rmw_zenohd<\u002Fdiv>\n        <p style=\"font:500 12.5px/1.6 var(--font-sans); color:var(--text-muted); margin:8px 0 0;\">모든 ROS 노드의 <b>교환원<\u002Fb> — 이게 없으면 노드들이 서로를 못 찾습니다. <b>계속 켜두고, 다른 launch를 재시작해도 이건 끄지 마세요.<\u002Fb> \"Unable to connect to a Zenoh router\" 에러 = 이 터미널이 죽은 것.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"card__bar\"><div class=\"card__t\">터미널 ② — 팔로워암 (탭 1 · 2용)<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:14px 18px 16px;\">\n        <div class=\"cmd\"><span class=\"c\"># ① 포트 번호부터 확인 (가장 먼저! · 보통 팔로워=ACM1 · 리더=ACM0, 꽂은 순서에 따라 바뀜)<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> ls /dev/ttyACM*\n<span class=\"c\"># ② 확인한 팔로워 번호를 port_name 에 그대로 입력<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> ros2 launch open_manipulator_bringup omx_f.launch.py <span class=\"yel\">port_name:=/dev/ttyACM1<\u002Fspan><\u002Fdiv>\n        <p style=\"font:500 12.5px/1.6 var(--font-sans); color:var(--text-muted); margin:8px 0 0;\">관절 제어·MoveJ/MoveL 탭이 명령을 보내는 팔. 팔로워만 쓸 거면 터미널 ③은 생략 가능. <b style=\"color:#B8860B;\">위 <span class=\"mono\">ls /dev/ttyACM*<\u002Fspan> 로 확인한 번호로 바꿔주세요.<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"card__bar\"><div class=\"card__t\">터미널 ③ — 리더암 (탭 3용) ⚠ 팔 잡고 실행<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:14px 18px 16px;\">\n        <div class=\"cmd\"><span class=\"c\"># 터미널 ②에서 ls /dev/ttyACM* 로 확인한 번호 중 리더 포트를 port_name 에 입력<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> ros2 launch open_manipulator_bringup omx_l_leader_ai.launch.py <span class=\"yel\">port_name:=/dev/ttyACM0<\u002Fspan><\u002Fdiv>\n        <p style=\"font:500 12.5px/1.6 var(--font-sans); color:var(--text-muted); margin:8px 0 0;\">리더암은 USB-C만 연결(별도 전원 불필요). launch가 뜨는 순간 임피던스 컨트롤러가 활성될 수 있으니 <b>팔을 손으로 받친 채<\u002Fb> 실행하세요. <b style=\"color:#B8860B;\">위 <span class=\"mono\">ls /dev/ttyACM*<\u002Fspan> 로 확인한 번호로 바꿔주세요.<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"card__bar\"><div class=\"card__t\">터미널 ④ — rosbridge (앱 연결용)<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:14px 18px 16px;\">\n        <div class=\"cmd\"><span class=\"pr\">$<\u002Fspan> ros2 launch rosbridge_server rosbridge_websocket_launch.xml<\u002Fdiv>\n        <p style=\"font:500 12.5px/1.6 var(--font-sans); color:var(--text-muted); margin:8px 0 0;\"><span class=\"mono\">port 9090<\u002Fspan> 메시지가 뜨면 준비 완료. zenohd(터미널 ①)를 재시작했다면 이것도 재시작해야 합니다.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card\">\n    <div class=\"card__bar\"><div class=\"card__t\">마지막 — 앱 연결<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:14px 18px 16px;\">\n      <ol style=\"margin:0; padding-left:20px; font:500 13.5px/1.8 var(--font-sans); color:var(--text-body);\">\n        <li>같은 PC 브라우저 → 상단 주소창에 <span class=\"mono\">ws://localhost:9090<\u002Fspan> 입력 후 <b>연결<\u002Fb><\u002Fli>\n        <li>다른 PC에서 → 로봇 PC IP 확인(<span class=\"mono\">hostname -I<\u002Fspan>) 후 <span class=\"mono\">ws://&lt;IP&gt;:9090<\u002Fspan> · 도커는 <span class=\"mono\">--network host<\u002Fspan> 또는 <span class=\"mono\">-p 9090:9090<\u002Fspan> 필요<\u002Fli>\n        <li>⚠ 이 페이지를 <b>https<\u002Fb>로 열면 <span class=\"mono\">ws://<\u002Fspan> 접속이 차단됩니다 — 받은 <b>.html 파일을 크롬 등 브라우저로 여세요<\u002Fb> (더블클릭 또는 브라우저에서 파일 열기)<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsection>\n\n  <details style=\"display:none;\">\n    <summary><\u002Fsummary>\n    <div class=\"help\" style=\"display:none;\">\n      <p style=\"margin-top:4px;\"><b>이 앱은 로봇을 직접 빌드하지 않습니다.<\u002Fb> ROS 2 메시지를 <span class=\"mono\">rosbridge<\u002Fspan>로 보낼 뿐이고, 모터를 돌리는 컨트롤러(C++)는 아래 <span class=\"mono\">omx_f.launch.py<\u002Fspan>가 이미 띄워줍니다. 따로 <span class=\"mono\">colcon build<\u002Fspan> 할 필요 없습니다. 아래 두 터미널만 <b>OMX가 연결된 PC의 Docker 컨테이너 안<\u002Fb>에서 띄우면 됩니다.<\u002Fp>\n\n      <p style=\"margin-bottom:4px;\"><b>0 · 컨테이너 접속<\u002Fb> — OMX 도커 컨테이너에 들어갑니다. (컨테이너 이름은 환경에 따라 다름)<\u002Fp>\n      <div class=\"cmd\"><span class=\"pr\">$<\u002Fspan> docker exec -it <span class=\"hl\">&lt;컨테이너이름&gt;<\u002Fspan> bash\n<span class=\"c\"># 컨테이너 이름 확인:  docker ps<\u002Fspan><\u002Fdiv>\n\n      <p style=\"margin-bottom:4px;\"><b>1 · 컨트롤러<\u002Fb> — 터미널 1 (컨테이너 안). <b>어떤 팔을 쓰느냐에 따라 launch가 다릅니다.<\u002Fb><\u002Fp>\n      <div class=\"cmd\"><span class=\"c\"># open_manipulator 5.0.0+ 는 Zenoh RMW 사용 — 데몬을 별도 터미널에서 먼저!<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> ros2 run rmw_zenoh_cpp rmw_zenohd   <span class=\"c\"># ← 터미널 0 · 계속 켜둠<\u002Fspan>\n<span class=\"c\"># 아래는 새 터미널에서 (모든 터미널 공통)<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> export RMW_IMPLEMENTATION=rmw_zenoh_cpp\n<span class=\"c\"># ── A. 팔로워암 (탭 1 관절 제어 · 탭 2 MoveJ/MoveL) ──<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> ros2 launch open_manipulator_bringup <span class=\"hl\">omx_f.launch.py<\u002Fspan>\n<span class=\"c\"># ── B. 리더암 (탭 3 임피던스·중력보상 미러링) ──<\u002Fspan>\n<span class=\"c\">#    포트는 환경에 따라 다름: ls /dev/ttyACM* 으로 확인<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> ros2 launch open_manipulator_bringup <span class=\"hl\">omx_l_leader_ai.launch.py<\u002Fspan> port_name:=/dev/ttyACM0<\u002Fdiv>\n      <p style=\"color:var(--text-muted);font-size:13px;margin-top:-4px;\">리더암은 USB-C만 꽂으면 됩니다(별도 전원 불필요). 팔로워·리더를 동시에 쓰려면 터미널을 하나 더 열어 A·B를 각각 띄우세요. 리더암 토픽은 <span class=\"mono\">/leader/joint_states<\u002Fspan>로 올라옵니다.<\u002Fp>\n\n      <p style=\"margin-bottom:4px;\"><b>2 · rosbridge<\u002Fb> — 터미널 2 (같은 컨테이너, 새 터미널). <span class=\"mono\">docker exec -it &lt;이름&gt; bash<\u002Fspan> 로 한 번 더 들어가면 됩니다.<\u002Fp>\n      <div class=\"cmd\"><span class=\"c\"># 최초 1회만 설치<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> sudo apt update &amp;&amp; sudo apt install -y ros-jazzy-rosbridge-suite ros-jazzy-rmw-zenoh-cpp\n<span class=\"c\"># 매번 실행 — 컨트롤러와 같은 RMW(Zenoh)여야 통신됩니다 · zenohd 데몬이 떠 있어야 함<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> export RMW_IMPLEMENTATION=rmw_zenoh_cpp\n<span class=\"pr\">$<\u002Fspan> ros2 launch rosbridge_server <span class=\"hl\">rosbridge_websocket_launch.xml<\u002Fspan><\u002Fdiv>\n      <p style=\"color:var(--text-muted);font-size:13px;margin-top:-4px;\">성공하면 <span class=\"mono\">Rosbridge WebSocket server started on port 9090<\u002Fspan> 메시지가 뜹니다. 이게 보인 뒤에 연결하세요.<\u002Fp>\n\n      <p style=\"margin-bottom:4px;\"><b>3 · 연결<\u002Fb> — 위 입력창에 주소를 넣고 <b>연결<\u002Fb>.<\u002Fp>\n      <ol style=\"margin-top:2px;\">\n        <li>같은 PC(브라우저도 그 PC)라면 → <span class=\"mono\">ws://localhost:9090<\u002Fspan><\u002Fli>\n        <li>다른 PC에서 본다면 → 로봇 PC의 IP 확인 후 <span class=\"mono\">ws://&lt;IP&gt;:9090<\u002Fspan> &nbsp;(<span class=\"mono\">hostname -I<\u002Fspan>). 도커를 <span class=\"mono\">--network host<\u002Fspan> 로 띄웠거나 <span class=\"mono\">-p 9090:9090<\u002Fspan> 포트를 열어둬야 합니다.<\u002Fli>\n        <li>그리퍼·관절이 안 움직이면 → 상단 <b>토픽 목록<\u002Fb> 버튼으로 컨트롤러 이름을 확인하고 <b>고급 설정<\u002Fb>에서 맞춰주세요.<\u002Fli>\n      <\u002Fol>\n\n      <p style=\"color:var(--text-muted);font-size:13px;\">⚠️ 이 페이지를 <b>https<\u002Fb>로 열면 브라우저가 <span class=\"mono\">ws://<\u002Fspan>(비암호) 접속을 차단합니다(Mixed Content). 받은 <b>.html 파일을 더블클릭(file://)<\u002Fb>하거나 <span class=\"mono\">http://localhost<\u002Fspan>로 여세요. <br>⚠️ <b>그림 그리기 페이지는 교육용 시뮬레이션<\u002Fb>입니다. 실제 로봇이 펜으로 그리게 하려면 <span class=\"mono\">cyclo_control<\u002Fspan>/<span class=\"mono\">omx_drawing<\u002Fspan> 패키지를 컨테이너에서 별도로 빌드·실행해야 합니다.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdetails>\n\n  <div class=\"safety\">\n    <span><b>안전<\u002Fb> — 로봇 주변을 정리하고, 처음에는 작은 각도로 천천히 시험하세요.<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"log\" id=\"log\"><\u002Fdiv>\n\n<\u002Fdiv>\n\n<!-- omx-arm 3D viewer (real URDF + meshes) -->\n<script type=\"module\">\n  import * as THREE from 'three';\n  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';\n  import { STLLoader } from 'three/addons/loaders/STLLoader.js';\n  import URDFLoader from 'urdf-loader';\n  import { PointerURDFDragControls } from 'https://cdn.jsdelivr.net/npm/urdf-loader@0.12.6/src/URDFDragControls.js';\n  const RAW = 'https://raw.githubusercontent.com/ROBOTIS-GIT/open_manipulator/main/open_manipulator_description';\n  const C_SILVER = 0xc2c7cd;\n  const geomCache = new Map();\n  const HOME = { joint1: 0.2, joint2: -0.4, joint3: 0.6, joint4: 0.3, joint5: 0 };\n  class OmxArm extends HTMLElement {\n    connectedCallback() {\n      if (this._init) return; this._init = true;\n      this._showPen = this.hasAttribute('pen');\n      this._ready = []; this._build(); this._load();\n    }\n    ready() { return this._robot ? Promise.resolve(this) : new Promise((r) => this._ready.push(r)); }\n    _build() {\n      this.style.cssText = 'position:relative;display:block';\n      const scene = new THREE.Scene(); this._scene = scene;\n      const cam = new THREE.PerspectiveCamera(38, 1, 0.01, 100); cam.position.set(0.42, 0.34, 0.46); this._cam = cam;\n      const rdr = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });\n      rdr.setClearColor(0, 0); rdr.setPixelRatio(Math.min(devicePixelRatio, 2));\n      rdr.shadowMap.enabled = true; rdr.shadowMap.type = THREE.PCFSoftShadowMap; rdr.outputColorSpace = THREE.SRGBColorSpace;\n      this._rdr = rdr; rdr.domElement.style.cssText = 'width:100%;height:100%;display:block;cursor:grab'; this.appendChild(rdr.domElement);\n      const st = document.createElement('div');\n      st.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:500 13px var(--font-mono);color:var(--text-muted);';\n      st.textContent = 'OMX-F 모델 불러오는 중…'; this.appendChild(st); this._st = st;\n      scene.add(new THREE.HemisphereLight(0xffffff, 0xb9bdc4, 1.05));\n      const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(0.6, 1.2, 0.7); key.castShadow = true;\n      key.shadow.mapSize.set(2048, 2048); key.shadow.camera.near = 0.1; key.shadow.camera.far = 4;\n      key.shadow.camera.left = -0.6; key.shadow.camera.right = 0.6; key.shadow.camera.top = 0.6; key.shadow.camera.bottom = -0.6;\n      key.shadow.bias = -0.0006; key.shadow.radius = 6; scene.add(key);\n      const fill = new THREE.DirectionalLight(0xdfe7ff, 0.5); fill.position.set(-0.7, 0.4, -0.5); scene.add(fill);\n      const g = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.ShadowMaterial({ opacity: 0.16 }));\n      g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);\n      const c = new OrbitControls(cam, rdr.domElement);\n      c.enableDamping = true; c.dampingFactor = 0.09; c.enablePan = false; c.enableZoom = false; c.maxPolarAngle = Math.PI * 0.52;\n      // 자체 줌: 장치(마우스/트랙패드) 무관하게 한 번에 3%씩만 — 극단 점프 방지\n      let _lastZoom = 0;\n      rdr.domElement.addEventListener('wheel', (e) => {\n        e.preventDefault();\n        const now = performance.now(); if (now - _lastZoom < 45) return; _lastZoom = now;\n        const dir = e.deltaY > 0 ? 1 : -1;\n        const off = cam.position.clone().sub(c.target); const d = off.length();\n        const nd = Math.max(0.3, Math.min(1.9, d * (1 + dir * 0.03)));\n        cam.position.copy(c.target).addScaledVector(off.normalize(), nd);\n      }, { passive: false });\n      this._ctrl = c;\n      this._ro = new ResizeObserver(() => this._resize()); this._ro.observe(this);\n      this._loop = this._loop.bind(this);\n    }\n    _load() {\n      const loader = new URDFLoader(); loader.packages = { open_manipulator_description: RAW };\n      loader.loadMeshCb = (path, mgr, done) => {\n        const apply = (geo) => { const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: C_SILVER, metalness: 0.35, roughness: 0.5, transparent: true, opacity: 0.95 })); m.castShadow = true; done(m); };\n        if (geomCache.has(path)) return apply(geomCache.get(path));\n        new STLLoader(mgr).load(path, (geo) => { geo.computeVertexNormals(); geomCache.set(path, geo); apply(geo); }, undefined, (e) => done(null, e));\n      };\n      const model = this.getAttribute('model') || 'omx_f';\n      loader.load(RAW + '/urdf/' + model + '/' + model + '.urdf', (robot) => {\n        robot.rotation.x = -Math.PI / 2; this._scene.add(robot); this._robot = robot;\n        const finish = () => {\n          for (const link of Object.values(robot.links || {})) {\n            if (link.name === 'end_effector_link') link.traverse((o) => { if (o.isMesh) o.visible = false; });\n          }\n          this._installPen(robot); this.setJoints(HOME); robot.updateMatrixWorld(true);\n          const box = new THREE.Box3().setFromObject(robot); robot.position.y -= box.min.y; robot.updateMatrixWorld(true);\n          const b2 = new THREE.Box3().setFromObject(robot); const ctr = b2.getCenter(new THREE.Vector3()); const r = Math.max(...b2.getSize(new THREE.Vector3()).toArray());\n          this._ctrl.target.copy(ctr); this._cam.position.set(ctr.x + r * 1.2, ctr.y + r * 0.42, ctr.z + r * 1.25);\n          this._cam.near = r / 100; this._cam.far = r * 40; this._cam.updateProjectionMatrix(); this._ctrl.update();\n          this._st.style.display = 'none'; this._resize(); this._loop(); this._setupDrag();\n          this._ready.forEach((r) => r(this)); this._ready = [];\n        };\n        let n = 0; const poll = () => { let m = 0; robot.traverse((o) => { if (o.isMesh) m++; }); (m >= 8 || n++ > 60) ? finish() : setTimeout(poll, 100); }; poll();\n      }, undefined, (e) => { this._st.innerHTML = 'OMX 3D 모델 로드 실패<br>네트워크를 확인하세요.'; });\n    }\n    _resize() { const w = this.clientWidth || 1, h = this.clientHeight || 1; this._rdr.setSize(w, h, false); this._cam.aspect = w / h; this._cam.updateProjectionMatrix(); }\n    reframe() { if (!this._robot) return; const b2 = new THREE.Box3().setFromObject(this._robot); const ctr = b2.getCenter(new THREE.Vector3()); const r = Math.max(...b2.getSize(new THREE.Vector3()).toArray()); this._ctrl.target.copy(ctr); this._cam.position.set(ctr.x + r * 1.2, ctr.y + r * 0.42, ctr.z + r * 1.25); this._cam.near = r / 100; this._cam.far = r * 40; this._cam.updateProjectionMatrix(); this._ctrl.update(); }\n    _eePos(pose) { const saved = {}; ['joint1','joint2','joint3','joint4','joint5'].forEach((n) => { const j = this._robot.joints[n]; if (j) saved[n] = j.angle; }); for (const n in pose) { if (this._robot.joints[n]) this._robot.setJointValue(n, pose[n]); } this._robot.updateMatrixWorld(true); const p = this._penTip.getWorldPosition(new THREE.Vector3()); for (const n in saved) this._robot.setJointValue(n, saved[n]); this._robot.updateMatrixWorld(true); return p; }\n    setEndpoints(poseA, poseB, colA, colB) {\n      if (!this._robot || !this._penTip) return;\n      if (this._epGroup) { this._scene.remove(this._epGroup); }\n      const g = new THREE.Group();\n      const pA = this._eePos(poseA), pB = this._eePos(poseB);\n      const dot = (p, col, rad) => { const m = new THREE.Mesh(new THREE.SphereGeometry(rad, 20, 20), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.4, metalness: 0.1, roughness: 0.5 })); m.position.copy(p); g.add(m);\n        const halo = new THREE.Mesh(new THREE.SphereGeometry(rad * 1.9, 18, 18), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.14 })); halo.position.copy(p); g.add(halo); };\n      dot(pA, colA, 0.010);\n      dot(pB, colB, 0.014);\n      this._scene.add(g); this._epGroup = g;\n      this._epA = pA; this._epB = pB;\n    }\n    _loop() { requestAnimationFrame(this._loop); this._ctrl.update(); this._rdr.render(this._scene, this._cam); }\n    _setupDrag() {\n      const dc = new PointerURDFDragControls(this._scene, this._cam, this._rdr.domElement);\n      dc.updateJoint = (joint, angle) => { if (this.clampJoint) angle = this.clampJoint(joint.name, angle); joint.setJointValue(angle); if (this.onJointDrag) this.onJointDrag(joint.name, joint.angle); };\n      dc.onDragStart = (joint) => { this._ctrl.enabled = false; this._rdr.domElement.style.cursor = 'grabbing'; if (this.onDragStart) this.onDragStart(joint.name); };\n      dc.onDragEnd = (joint) => { this._ctrl.enabled = true; this._rdr.domElement.style.cursor = 'grab'; if (this.onDragEnd) this.onDragEnd(joint.name); };\n      dc.onHover = () => { this._rdr.domElement.style.cursor = 'grab'; };\n      dc.onUnhover = () => { this._rdr.domElement.style.cursor = 'grab'; };\n      this._dc = dc;\n    }\n    setJoint(n, v) { if (this._robot && this._robot.setJointValue) this._robot.setJointValue(n, v); }\n    setJoints(o) { if (this._robot) for (const k in o) this._robot.setJointValue(k, o[k]); }\n    _installPen(robot) {\n      const eff = robot.links && robot.links['end_effector_link'];\n      if (!eff) return;\n      const tip = new THREE.Object3D(); tip.position.set(0.01, 0, 0); eff.add(tip); this._penTip = tip;\n      if (this._showPen) {\n        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, 0.09, 14), new THREE.MeshStandardMaterial({ color: 0x26282c, metalness: 0.3, roughness: 0.5 }));\n        body.rotation.z = Math.PI / 2; body.position.set(0.046, 0, 0); body.castShadow = true; eff.add(body);\n        const nib = new THREE.Mesh(new THREE.ConeGeometry(0.0045, 0.014, 14), new THREE.MeshStandardMaterial({ color: 0xec4b7e }));\n        nib.rotation.z = -Math.PI / 2; nib.position.set(0.098, 0, 0); nib.castShadow = true; eff.add(nib);\n      }\n    }\n    penWorld() { if (!this._penTip || !this._robot) return new THREE.Vector3(); this._robot.updateMatrixWorld(true); return this._penTip.getWorldPosition(new THREE.Vector3()); }\n    solveIK(target, joints, iters) {\n      if (!this._robot) return {};\n      joints = joints || ['joint1', 'joint2', 'joint3', 'joint4'];\n      const J = joints.map((n) => this._robot.joints[n]).filter(Boolean);\n      for (let it = 0; it < (iters || 6); it++) {\n        for (let i = J.length - 1; i >= 0; i--) {\n          const j = J[i];\n          this._robot.updateMatrixWorld(true);\n          const jp = new THREE.Vector3().setFromMatrixPosition(j.matrixWorld);\n          const axis = (j.axis ? j.axis.clone() : new THREE.Vector3(0, 0, 1)).transformDirection(j.matrixWorld).normalize();\n          const end = this.penWorld();\n          const ve = end.clone().sub(jp); ve.sub(axis.clone().multiplyScalar(ve.dot(axis)));\n          const vt = target.clone().sub(jp); vt.sub(axis.clone().multiplyScalar(vt.dot(axis)));\n          if (ve.lengthSq() < 1e-8 || vt.lengthSq() < 1e-8) continue;\n          ve.normalize(); vt.normalize();\n          let ang = Math.acos(Math.max(-1, Math.min(1, ve.dot(vt))));\n          if (ang < 1e-5) continue;\n          if (ve.clone().cross(vt).dot(axis) < 0) ang = -ang;\n          ang = Math.max(-0.3, Math.min(0.3, ang));\n          let na = (j.angle || 0) + ang;\n          if (j.limit) { if (isFinite(j.limit.lower)) na = Math.max(j.limit.lower, na); if (isFinite(j.limit.upper)) na = Math.min(j.limit.upper, na); }\n          j.setJointValue(na);\n        }\n      }\n      const out = {}; ['joint1', 'joint2', 'joint3', 'joint4', 'joint5'].forEach((n) => { const jj = this._robot.joints[n]; if (jj) out[n] = jj.angle; }); return out;\n    }\n    setPaper(center, size, y) {\n      if (this._paper) this._scene.remove(this._paper);\n      const g = new THREE.Group();\n      const sheet = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, metalness: 0 }));\n      sheet.rotation.x = -Math.PI / 2; sheet.position.set(center.x, y - 0.0012, center.z); sheet.receiveShadow = true; g.add(sheet);\n      const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(size, size)), new THREE.LineBasicMaterial({ color: 0xd9d6d2 }));\n      edge.rotation.x = -Math.PI / 2; edge.position.set(center.x, y - 0.001, center.z); g.add(edge);\n      this._scene.add(g); this._paper = g;\n    }\n    clearInk() { if (this._inkG) this._scene.remove(this._inkG); this._inkG = new THREE.Group(); this._scene.add(this._inkG); this._cur = null; }\n    addInk(p) {\n      if (!this._inkG) this.clearInk();\n      if (!this._cur || this._cur.n >= 3998) { const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(4000 * 3), 3)); geo.setDrawRange(0, 0); const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: this._inkColor || 0x18181b, transparent: true, opacity: 0.95 })); this._inkG.add(line); this._cur = { geo, n: 0, line }; }\n      const a = this._cur.geo.attributes.position.array; a[this._cur.n * 3] = p.x; a[this._cur.n * 3 + 1] = p.y; a[this._cur.n * 3 + 2] = p.z; this._cur.n++;\n      this._cur.geo.setDrawRange(0, this._cur.n); this._cur.geo.attributes.position.needsUpdate = true; this._cur.geo.computeBoundingSphere();\n    }\n    liftPen() { this._cur = null; }\n    setInkColor(c) { this._inkColor = c; this._cur = null; }\n  }\n  if (!customElements.get('omx-arm')) customElements.define('omx-arm', OmxArm);\n<\u002Fscript>\n\n<!-- control logic -->\n<script type=\"module\">\n  import * as THREE from 'three';\n  const D2R = Math.PI / 180, R2D = 180 / Math.PI;\n  const $ = (s) => document.querySelector(s);\n  const twin = document.getElementById('twin');\n  const statusEl = $('#status'), statusTxt = $('#statusTxt');\n  const logEl = $('#log');\n  const ros = { obj: null, armT: null, gripAction: null, js: null, topicsSvc: null, connected: false };\n\n  function log(msg, cls) {\n    const t = new Date().toLocaleTimeString('en-GB');\n    const div = document.createElement('div');\n    div.innerHTML = '<span class=\"t\">' + t + '<\u002Fspan>  ' + (cls ? '<span class=\"' + cls + '\">' + msg + '<\u002Fspan>' : msg);\n    logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;\n  }\n  function setStatus(s, txt) { statusEl.dataset.s = s; statusTxt.textContent = txt; $('#twinLive').toggleAttribute('data-on', s === 'on'); $('#twinLive').textContent = s === 'on' ? 'live · /joint_states' : 'offline pr ineDash([6,7]); ctx.strokeStyle=STEEL; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx(hA.x),cy(hA.y)); ctx.lineTo(cx(hB.x),cy(hB.y)); ctx.stroke(); ctx.restore();\n      var sJ=mode==='movej'||mode==='both', sL=mode==='movel'||mode==='both';\n      arm(qB,0.1,STEELD);\n      if(sJ) trail(pJ,u,CJ,mode==='both'?4:5);\n      if(sL) trail(pL,u,CL,mode==='both'?4:5);\n      if(mode==='both'){ arm(lq(qA,qB,u),0.5,CJ); var tl={x:hA.x+(hB.x-hA.x)*u,y:hA.y+(hB.y-hA.y)*u}; arm(ik(tl),0.95,CL); }\n      else if(sJ){ arm(lq(qA,qB,u),0.95,CJ); }\n      else { var tl2={x:hA.x+(hB.x-hA.x)*u,y:hA.y+(hB.y-hA.y)*u}; arm(ik(tl2),0.95,CL); }\n      mk(hA,'A','시작'); mk(hB,'B','목표'); }\n    function tick(){ if(!playing) return; u+=0.007*speed; if(u>=1){ u=1; playing=false; document.getElementById('cmpPlay').textContent='↻ 다시'; clearInterval(timer); render(); return; } render(); }\n    function play(){ if(u>=1) u=0; playing=true; document.getElementById('cmpPlay').textContent='❚❚ 일시정지'; clearInterval(timer); timer=setInterval(tick,1000/60); }\n    function pause(){ playing=false; document.getElementById('cmpPlay').textContent='▶ 재생'; clearInterval(timer); }\n    document.getElementById('cmpPlay').addEventListener('click', function(){ playing?pause():play(); });\n    document.getElementById('cmpSpeed').addEventListener('input', function(e){ speed=+e.target.value; });\n    document.getElementById('cmpSeg').addEventListener('click', function(e){ var bt=e.target.closest('button'); if(!bt) return; mode=bt.dataset.m;\n      [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===bt); });\n      document.getElementById('cmpBj').style.display=(mode==='movel')?'none':'block';\n      document.getElementById('cmpBl').style.display=(mode==='movej')?'none':'block';\n      document.getElementById('cmpBj').textContent=mode==='both'?'MoveJ — 곡선':'MoveJ — 끝단이 곡선';\n      document.getElementById('cmpBl').textContent=mode==='both'?'MoveL — 직선':'MoveL — 끝단이 직선';\n      u=0; render(); });\n    function fit(){ var cssW=cv.clientWidth||W; var r=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(cssW*r); cv.height=Math.round(cssW*(H/W)*r); render(); }\n    window.addEventListener('resize', fit); window.__cmpFit=fit; fit(); render();\n  })();\n\n  // --- 실제 OMX 실행 + URDF 3D 애니메이션: 초기 자세 → MoveJ / MoveL (같은 목표) ---\n  const cmpTwin = document.getElementById('cmpTwin');\n  const CMP_INIT = { joint1: -0.04, joint2: -1.24, joint3: 1.16, joint4: 0.59, joint5: 0.0 };\n  const CMP_GOAL = { joint1: 0.02, joint2: -0.23, joint3: 0.0, joint4: 0.44, joint5: -0.01 };\n  const CJN = ['joint1','joint2','joint3','joint4','joint5'];\n  let cmpCur = Object.assign({}, CMP_INIT), cmpAnimTimer = null;\n  function cmpHint(t){ const e = document.getElementById('cmpRunHint'); if (e) e.textContent = t; }\n  function cmpStopAnim(){ if (cmpAnimTimer) { clearInterval(cmpAnimTimer); cmpAnimTimer = null; } }\n  function cmpSetTwin(pose){ if (cmpTwin && cmpTwin._robot) CJN.forEach((n) => cmpTwin.setJoint(n, pose[n] || 0)); cmpCur = Object.assign({}, pose); }\n  // ease-in-out joint animation (MoveJ 느낌: 관절 선형 → 끝단 곡선)\n  function cmpAnimJoints(from, to, dur, done, ink){\n    cmpStopAnim(); if (!cmpTwin || !cmpTwin._robot) { cmpSetTwin(to); if (done) done(); return; }\n    if (ink && cmpTwin.setInkColor) cmpTwin.setInkColor(ink);\n    const t0 = performance.now();\n    cmpAnimTimer = setInterval(() => {\n      const k = Math.min(1, (performance.now() - t0) / dur), e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;\n      const cur = {}; CJN.forEach((n) => { cur[n] = (from[n]||0) + ((to[n]||0)-(from[n]||0))*e; cmpTwin.setJoint(n, cur[n]); });\n      cmpCur = cur;\n      if (ink) cmpTwin.addInk(cmpTwin.penWorld());\n      if (k >= 1) { cmpStopAnim(); if (done) done(); }\n    }, 1000/60);\n  }\n  // waypoint animation (MoveL: IK로 푼 직선 경로 재생)\n  function cmpAnimPath(pts, dur, done, ink){\n    cmpStopAnim(); if (!cmpTwin || !cmpTwin._robot) { if (pts.length) cmpSetTwin(pts[pts.length-1] (true); const P1 = cmpTwin.penWorld().clone();\n    cmpTwin.setJoints(CMP_INIT);\n    const M = 40, pts = [];\n    for (let k = 1; k <= M; k++) { const t = k / M; cmpTwin.solveIK(P0.clone().lerp(P1, t), ['joint1','joint2','joint3','joint4'], 10);\n      const p = {}; CJN.forEach((n) => { const j = cmpTwin._robot.joints[n]; p[n] = j ? j.angle : 0; }); pts.push({ p, t: T * t }); }\n    // IK 웨이포인트 스무딩(3점 이동평균) — 미세 지그재그로 인한 떨림 제거\n    for (let s = 0; s < 2; s++) for (let k = 1; k < pts.length - 1; k++) CJN.forEach((n) => { pts[k].p[n] = (pts[k-1].p[n] + pts[k].p[n] * 2 + pts[k+1].p[n]) / 4; });\n    if (ros.connected && ros.armT) { const c = cfg();\n      ros.armT.publish(new ROSLIB.Message({ header: { stamp: timeMsg(0), frame_id: '' }, joint_names: c.armJoints,\n        points: pts.map((P) => ({ positions: c.armJoints.map((n) => P.p[n] != null ? P.p[n] : 0), velocities: [], accelerations: [], effort: [], time_from_start: timeMsg(P.t) })) }));\n      log('→ MoveL 직선 ' + M + '점 스트리밍 (' + T + '초)', 'tx'); }\n    for (const n of Object.keys(RANGE)) cmd[n] = CMP_GOAL[n]; syncAll(); previewTwin();\n    cmpAnimPath(pts, T*1000, null, 0x2A6FDB);\n    cmpHint(ros.connected ? ('MoveL 실행 — 직선 ' + M + '점 IK 스트리밍, ' + T + '초.') : ('MoveL · 3D 재생 — 끝단 직선 (미연결).'));\n  }\n  let cmpBusy = false, cmpNeedInit = false;\n  function cmpUpdateBtns(){ const set = (id, dis) => { const b = document.getElementById(id); if (b) { b.disabled = dis; b.style.opacity = dis ? 0.5 : 1; b.style.cursor = dis ? 'not-allowed' : 'pointer'; } };\n    set('cmpInit', cmpBusy); set('cmpRunJ', cmpBusy || cmpNeedInit); set('cmpRunL', cmpBusy || cmpNeedInit); }\n  function cmpSetBusy(on){ cmpBusy = on; cmpUpdateBtns(); }\n  function cmpSeq(fn){ if (cmpBusy || cmpNeedInit) return; cmpSetBusy(true); const T = (cfg().moveTime || 2);\n    cmpGoInit(() => { fn(); setTimeout(() => { cmpNeedInit = true; cmpSetBusy(false); cmpHint('이동 완료 — 다시 실행하려면 먼저 ① 초기 자세를 누르세요.'); }, T*1000 + 300); }); }\n  (function(){ const b0 = document.getElementById('cmpInit'), bj = document.getElementById('cmpRunJ'), bl = document.getElementById('cmpRunL');\n    if (b0) b0.addEventListener('click', () => { if (!cmpBusy) { cmpSetBusy(true); cmpGoInit(() => { cmpNeedInit = false; cmpSetBusy(false); }); } });\n    if (bj) bj.addEventListener('click', () => cmpSeq(cmpRunJ));\n    if (bl) bl.addEventListener('click', () => cmpSeq(cmpRunL)); })();\n  customElements.whenDefined('omx-arm').then(() => cmpTwin.ready()).then(() => { cmpSetTwin(CMP_INIT); if (cmpTwin.setEndpoints) cmpTwin.setEndpoints(CMP_INIT, CMP_GOAL, 0x8E939B, 0xEC4B7E); });\n\n  customElements.whenDefined('omx-arm').then(() => twin.ready()).then(() => { syncAll(); previewTwin(); log('\\uB514\\uC9C0\\uD138 \\uD2B8\\uC708 \\uC900\\uBE44\\uB428 — 3D \\uAD00\\uC808\\uC744 \\uB4DC\\uB798\\uADF8\\uD558\\uAC70\\uB098 \\uC2AC\\uB77C\\uC774\\uB354\\uB85C \\uC870\\uC791\\uD558\\uC138\\uC694 (\\uC624\\uD504\\uB77C\\uC778 \\uD504\\uB9AC\\uBDF0)', 'ok'); });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
