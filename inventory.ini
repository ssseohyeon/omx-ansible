# OMX 임피던스 교육 PC 목록
# 새 PC 추가: [omx] 아래에 호스트명 한 줄만 추가하면 됨
#   (규칙: 계정명 = 호스트명, 주소 = 호스트명.local — pinklab-ansible과 동일)
# mDNS(.local)가 안 되는 PC만 ansible_host=IP 를 직접 적어줄 것
#
# ⚠ 아직 어떤 PC에 OMX를 깔지 정하지 않아 전부 주석 상태.
#   대상 PC의 주석을 풀고 사용.

[omx]
pink
# pinklab3
# pinklab9
# pinklab10

[omx:vars]
ansible_host={{ inventory_hostname }}.local
ansible_user={{ inventory_hostname }}
