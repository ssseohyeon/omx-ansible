# 통합가이드 ④ — 컨테이너 시작 (container.sh start 의 내용을 모듈로 분해)
# 🔴 가이드 원칙 1: 이 플레이북은 compose down 을 절대 하지 않는다.
#    컨테이너를 지우면 rosbridge 설치와 colcon build 결과가 날아간다.
#    (지워져도 build.yml 재실행으로 복구는 된다)
- name: 컨테이너 기동
  hosts: omx
  become: true
  tasks:
    - name: U2D2 udev 규칙 등록
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-u2d2.rules
        content: |
          KERNEL=="ttyUSB*", DRIVERS=="ftdi_sio", MODE="0666", ATTR{device/latency_timer}="1"
        mode: "0644"
      register: udev_rule

    - name: udev 규칙 반영
      ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger
      when: udev_rule.changed

    - name: 이미지 존재 확인
      ansible.builtin.command: docker image inspect {{ omx_image }}
      register: img_chk
      changed_when: false
      failed_when: false

    - name: 이미지 pull (수 GB — 첫 회는 수십 분, 수업 전날 미리 돌릴 것)
      ansible.builtin.command: >
        docker compose -f {{ om_dir }}/docker/docker-compose.yml pull
      when: img_chk.rc != 0

    - name: 컨테이너 기동 (up -d)
      ansible.builtin.command: >
        docker compose -f {{ om_dir }}/docker/docker-compose.yml up -d --no-build
      register: up_out
      changed_when: "'Started' in up_out.stderr or 'Created' in up_out.stderr"

    - name: 컨테이너 동작 확인
      ansible.builtin.command: >
        docker ps --filter name=^{{ omx_container_name }}$ --filter status=running -q
      register: ps_chk
      changed_when: false
      failed_when: ps_chk.stdout == ""
